name: GrowthTrack platform builds
on:
  pull_request:
    paths: ['growthtrack-ultimate/**', '.github/workflows/platform-builds.yml']
  push:
    branches: [main, master]
    paths: ['growthtrack-ultimate/**', '.github/workflows/platform-builds.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: growthtrack-ultimate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: docker compose config --quiet
      - run: docker build --tag growthtrack-ultimate:verification .
      - run: node scripts/test-container.mjs
  ios-companion:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Wire contract tests
        run: swift test --package-path growthtrack-ultimate/companions/ios
      - name: Build simulator application without signing
        run: >-
          xcodebuild -project growthtrack-ultimate/companions/ios/GrowthTrackHealth.xcodeproj
          -scheme GrowthTrackHealth -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
  android-companion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and test the Health Connect companion
        working-directory: growthtrack-ultimate/companions/android
        run: gradle --no-daemon --project-cache-dir '${{ runner.temp }}/growthtrack-gradle' testDebugUnitTest lintDebug assembleDebug
