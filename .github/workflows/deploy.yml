name: GrowthTrack Pages Deployment

# GrowthTrack requires desktop/backend services. Static Pages deployment is
# intentionally opt-in and cannot make normal pushes fail.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: growthtrack-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static preview
    if: vars.ENABLE_GITHUB_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: growthtrack-ultimate/package-lock.json

      - name: Install locked dependencies
        working-directory: growthtrack-ultimate
        run: npm ci

      - name: Build static preview
        working-directory: growthtrack-ultimate
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: growthtrack-ultimate/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
