name: Critical npm vulnerability gate
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - growthtrack-ultimate
          - Equity/NiftyLens
          - Family Connect/familyconnect/frontend
          - Family Connect/familyconnect/backend
          - FinSync
          - FinSync/OxFin/ox-fin-web
          - FinSync/Expense Tracker - Mobile/expense-tracker-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Reject critical vulnerabilities in the checked-in lockfile
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=critical
