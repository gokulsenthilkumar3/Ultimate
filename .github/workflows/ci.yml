name: GrowthTrack CI Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - "growthtrack-ultimate/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - ".nvmrc"
  pull_request:
    branches: [main, master]
    paths:
      - "growthtrack-ultimate/**"
      - ".github/workflows/ci.yml"
      - "package.json"
      - ".nvmrc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growthtrack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-guardrails:
    name: Agent guardrails
    # Playwright 1.59.1 does not support the rolling ubuntu-latest image when
    # GitHub advances it to Ubuntu 26.04. Keep browser dependencies on a
    # supported, reproducible runner until Playwright publishes a compatible
    # image recipe.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: growthtrack-ultimate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: growthtrack-ultimate/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Runtime dependency security audit
        run: npm run security:audit
      - name: Install isolated agent browser engine
        run: npx playwright install --with-deps chromium
      - name: Agent security, resource bounds and consent regressions
        run: npm run test:agents
        env:
          AGENTS_PROVIDER: ollama
          GROQ_API_KEY: ""
          OLLAMA_BASE_URL: ""
      - name: Agent review, privacy and conversation browser workflows
        run: npm run test:agents:e2e

  static-checks:
    name: Build and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: growthtrack-ultimate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: growthtrack-ultimate/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Asset provenance (hashes and licence status)
        run: npm run check:assets

      - name: Typecheck
        run: npm run typecheck

      - name: Digital human specification contracts
        run: npm run test:human-spec

      - name: Lint
        run: npm run lint

      - name: Dependency security audit
        run: npm run security:audit

      - name: Validate authored GLBs
        run: npm run validate:glb

      - name: Build production application
        run: npm run build

      - name: Verify startup budgets and compressed assets
        run: npm run performance:check

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: growthtrack-dist
          path: growthtrack-ultimate/dist
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: Unit and component coverage (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: growthtrack-ultimate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: growthtrack-ultimate/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Install browser engine for CSS geometry tests
        run: npx playwright install --with-deps chromium
      - name: Unit and component tests with coverage
        run: npm run test:run -- --maxWorkers=2 --shard=${{ matrix.shard }}/4
      - name: Upload unit coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growthtrack-unit-evidence-${{ matrix.shard }}
          path: growthtrack-ultimate/coverage
          if-no-files-found: ignore
          retention-days: 14

  backend-tests:
    name: Isolated API and migration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: growthtrack-ultimate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: growthtrack-ultimate/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Isolated API, migration and backup/restore tests
        run: node tests/unit/server-backend/run.mjs

  browser-tests:
    name: Browser workflows (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: growthtrack-ultimate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: growthtrack-ultimate/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Install browser test engine
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Authenticated browser fixture workflows
        run: npm run test:e2e -- --project=${{ matrix.browser }} --workers=2
      - name: Upload browser workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growthtrack-browser-${{ matrix.browser }}
          path: growthtrack-ultimate/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Preserve the required check name and fail it whenever any independent gate
  # fails or is cancelled. Long test suites no longer share one job's deadline.
  quality:
    name: Quality Gate
    if: ${{ always() }}
    needs: [static-checks, unit-tests, backend-tests, browser-tests, agent-guardrails]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          CHECK_RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$CHECK_RESULTS" != "success,success,success,success,success" ]]; then
            printf 'Required check results: %s\n' "$CHECK_RESULTS"
            exit 1
          fi
