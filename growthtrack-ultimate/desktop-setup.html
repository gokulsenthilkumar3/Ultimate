<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'"><title>Set up GrowthTrack Ultimate</title>
<style>body{font:16px/1.5 system-ui;margin:0;background:#10141d;color:#eef2ff}main{max-width:480px;margin:8vh auto;padding:24px}label{display:block;margin:16px 0 4px}input,button{box-sizing:border-box;width:100%;min-height:44px;padding:12px;border-radius:8px;font:inherit}input{border:1px solid #8892ac;background:#1d2636;color:#fff}button{margin-top:24px;border:0;background:#d6a954;color:#10141d;font-weight:700}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #c8cfff;outline-offset:3px}#message{min-height:1.5em;color:#ffb4ab}</style>
<main><h1>Set up your private account</h1><p>Create the first account for this desktop installation. Your password is stored as a secure hash.</p><form id="setup"><label for="name">Your name</label><input id="name" name="fullName" required maxlength="200" autocomplete="name"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="12" autocomplete="new-password" aria-describedby="password-help"><p id="password-help">Use at least 12 characters, up to 72 UTF-8 bytes.</p><label for="confirm">Confirm password</label><input id="confirm" type="password" required autocomplete="new-password"><p id="message" role="alert"></p><button type="submit">Create account</button></form></main>
<script>document.querySelector('#setup').addEventListener('submit',async event=>{event.preventDefault();const form=event.target;const message=document.querySelector('#message');const button=form.querySelector('button');message.textContent='';if(form.password.value!==document.querySelector('#confirm').value){message.textContent='The passwords do not match.';return}button.disabled=true;try{const result=await window.growthTrackDesktop.provisionOwner({email:form.email.value,fullName:form.fullName.value,password:form.password.value});if(!result.success)throw new Error(result.error);form.password.value='';document.querySelector('#confirm').value='';message.textContent='Account created. Opening Ultimate…'}catch(error){message.textContent=error.message||'Account setup failed. Try again.';button.disabled=false}});</script></html>
